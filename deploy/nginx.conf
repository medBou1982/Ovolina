# Nginx : reçoit les visiteurs (ports 80/443) et transmet au serveur Node Ovolina (port 4000, local uniquement).
# __DOMAINES__ est remplacé par l'installateur. Le HTTPS est ajouté ensuite automatiquement par Certbot.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAINES__;

    # Photos envoyées depuis l'administration
    client_max_body_size 30m;

    # Compression des fichiers texte
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # En-têtes de sécurité
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
