<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F8C800" />
    <title>Ovolina – Bien Sûr Bnina</title>
    <meta name="description" content="Ovolina : production, conditionnement et distribution d’œufs frais de qualité en Tunisie. Traçabilité de la ferme à l’assiette." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="/logo.png" as="image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Caveat:wght@700&display=swap" />

    <!-- Écran de démarrage : affiché une fois par visite, jamais dans l'administration -->
    <script>
      (function () {
        var afficher = location.pathname.indexOf('/admin') !== 0;
        try { if (sessionStorage.getItem('ovolina_splash')) afficher = false; sessionStorage.setItem('ovolina_splash', '1'); } catch (e) {}
        document.documentElement.className += afficher ? ' avec-splash' : ' sans-splash';
        window.__debutSplash = Date.now();
      })();
    </script>
    <style>
      #splash { display: none; }
      .avec-splash #splash {
        position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: radial-gradient(circle at 50% 45%, #FFE066 0%, #F8C800 55%, #EDB800 100%);
        transition: transform .8s cubic-bezier(.7, 0, .2, 1), border-radius .8s cubic-bezier(.7, 0, .2, 1);
        overflow: hidden;
      }
      .avec-splash { overflow: hidden; }
      #splash.sortie { transform: translateY(-105%); border-radius: 0 0 50% 50% / 0 0 18% 18%; }

      /* L'œuf tombe, rebondit, puis s'ouvre en grand cercle blanc */
      .splash-scene { position: relative; width: 300px; height: 300px; display: flex; align-items: center; justify-content: center; }
      .splash-cercle { position: absolute; width: 300px; height: 300px; border-radius: 50%; background: #fff; transform: scale(0); animation: splashCercle .7s .75s cubic-bezier(.3, 1.5, .5, 1) forwards; box-shadow: 0 20px 60px rgba(0, 74, 39, .18); }
      .splash-oeuf { position: absolute; width: 74px; height: 89px; animation: splashChute .8s cubic-bezier(.5, 0, .5, 1) forwards, splashOeufFin .25s .78s ease-in forwards; transform-origin: 50% 100%; }
      .splash-logo { position: relative; width: 230px; height: auto; opacity: 0; transform: scale(.6) rotate(-6deg); animation: splashLogo .7s 1s cubic-bezier(.3, 1.6, .5, 1) forwards; }
      .splash-rayons { position: absolute; inset: -40px; opacity: 0; animation: splashRayons 1.6s 1.1s ease-out forwards; }
      .splash-rayons i { position: absolute; left: 50%; top: 50%; width: 6px; height: 26px; margin: -13px 0 0 -3px; border-radius: 3px; background: #004A27; }
      .splash-barre { position: absolute; bottom: 12%; width: 140px; height: 5px; border-radius: 5px; background: rgba(0, 74, 39, .18); overflow: hidden; }
      .splash-barre i { display: block; height: 100%; width: 100%; background: #004A27; transform-origin: left; transform: scaleX(0); animation: splashBarre 1.6s .2s ease-in-out forwards; }

      @keyframes splashChute {
        0% { transform: translateY(-60vh) rotate(-20deg); }
        55% { transform: translateY(0) rotate(0) scale(1.08, .86); }
        70% { transform: translateY(-38px) scale(.96, 1.05); }
        85% { transform: translateY(0) scale(1.04, .94); }
        100% { transform: translateY(0) scale(1); }
      }
      @keyframes splashOeufFin { to { transform: scale(0); opacity: 0; } }
      @keyframes splashCercle { to { transform: scale(1); } }
      @keyframes splashLogo { to { opacity: 1; transform: scale(1) rotate(0); } }
      @keyframes splashRayons { 0% { opacity: 0; transform: scale(.85) rotate(0); } 25% { opacity: 1; } 100% { opacity: 0; transform: scale(1.15) rotate(25deg); } }
      @keyframes splashBarre { to { transform: scaleX(1); } }

      @media (prefers-reduced-motion: reduce) {
        .splash-oeuf, .splash-rayons { display: none; }
        .splash-cercle, .splash-logo, .splash-barre i { animation-duration: .01s; animation-delay: 0s; }
        #splash { transition-duration: .2s; }
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <div class="splash-scene">
        <div class="splash-rayons">
          <i style="transform: rotate(0deg) translateY(-175px)"></i><i style="transform: rotate(45deg) translateY(-175px)"></i>
          <i style="transform: rotate(90deg) translateY(-175px)"></i><i style="transform: rotate(135deg) translateY(-175px)"></i>
          <i style="transform: rotate(180deg) translateY(-175px)"></i><i style="transform: rotate(225deg) translateY(-175px)"></i>
          <i style="transform: rotate(270deg) translateY(-175px)"></i><i style="transform: rotate(315deg) translateY(-175px)"></i>
        </div>
        <div class="splash-cercle"></div>
        <svg class="splash-oeuf" viewBox="0 0 40 48"><path d="M20 2C10 2 3 18 3 30a17 17 0 0 0 34 0C37 18 30 2 20 2z" fill="#fff" stroke="#004A27" stroke-width="2"/><ellipse cx="13" cy="17" rx="3" ry="5" fill="#FFF8E1" transform="rotate(20 13 17)"/></svg>
        <img class="splash-logo" src="/logo.png" alt="" width="230" height="100" />
      </div>
      <div class="splash-barre"><i></i></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
